[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nzgd"
authors = [
    {name = "QuakeCoRE" },
]
description = " Extract data from investigation source files in the New Zealand Geotechnical Database (NZGD)"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
    "source_modelling",
    "workflow",
    "pygmt_helper",
    "qcore",
    "empirical",
    "nshmdb",
    "IM_calculation",
    "mera",
    "vs_calc"
]

[tool.ruff.lint.per-file-ignores]
# Ignore no docstring in __init__.py
"__init__.py" = ["D104"]
# Ignore docstring errors in tests folder
"tests/**.py" = ["D"]

[tool.deptry.per_rule_ignores]
# Legacy: QuakeCoRE modules that requirements.txt does not install
DEP001 = ["qcore", "vs_calc", "nzgd_data_extraction"]
# Legacy: pandas loads pyarrow, python-calamine and pyxlsb by name; the others are not imported
DEP002 = [
  "python-dotenv",
  "tables",
  "python-calamine",
  "pyxlsb",
  "geopandas",
  "shapely",
  "pyarrow",
  "intervaltree",
]
