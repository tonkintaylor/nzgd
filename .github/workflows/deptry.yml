name: Deptry Dependency Check

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Setup the python version pinned in .python-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
          check-latest: true
      - run: pip install -r requirements.txt
      # Install deptry
      - run: pip install deptry
      # Remove pyproject.toml so that deptry doesn't get confused
      - run: rm pyproject.toml
      # Run deptry to check that all dependencies are present.
      - run: deptry . --per-rule-ignores "DEP001=qcore|vs_calc|nzgd_data_extraction,DEP002=python-dotenv|tables|python-calamine|pyxlsb|geopandas|shapely|pyarrow|intervaltree"
